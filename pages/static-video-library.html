<!DOCTYPE html>
<html lang="en-US" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Video Library - Vision AI</title>
  <script src="../custom_js/layout-loader.js"></script>
</head>

<body>
  <div id="page-content" style="display:none;">
    <div class="content">
      <div class="row gy-3 mb-3">
        <div class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div>
            <h2 class="mb-1 text-body-emphasis">Static Video Library</h2>
            <p class="text-body-tertiary fw-semibold mb-0 fs-9">
              Your uploaded videos. Select one for analysis in Chat.
            </p>
          </div>
          <button type="button" class="btn btn-phoenix-secondary btn-sm" id="library-refresh-btn">
            <span class="fas fa-rotate me-1"></span>Refresh
          </button>
        </div>
      </div>

      <div class="row g-3" id="library-grid"></div>

      <div class="card d-none" id="library-empty-card">
        <div class="card-body text-center py-6">
          <span class="fa-solid fa-video text-body-tertiary fs-4"></span>
          <p class="text-body-tertiary mt-2 mb-0">No static videos found for this user.</p>
        </div>
      </div>
    </div>

    <style>
      .library-video-card {
        cursor: default;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      .library-video-card:hover {
        transform: translateY(-2px);
      }
      .library-video-thumb {
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: #000;
        border-radius: 0.5rem;
      }
    </style>

    <script type="text/visionai-page-script">
(function () {
  'use strict';

  var CHAT_SELECTION_KEY = 'visionai_chat_selected_video_meta';
  var CHAT_PENDING_KEY = 'visionai_pending_chat_video';
  var CHAT_VIDEO_ID_KEY = 'visionai_chat_video_id';

  function formatDate(iso) {
    if (!iso) return 'Unknown date';
    try {
      var d = new Date(iso);
      if (Number.isNaN(d.getTime())) return 'Unknown date';
      return d.toLocaleString();
    } catch (_) {
      return 'Unknown date';
    }
  }

  function notifyError(message) {
    if (window.toastService && typeof window.toastService.error === 'function') {
      window.toastService.error(message);
    } else {
      alert(message);
    }
  }

  function notifySuccess(message) {
    if (window.toastService && typeof window.toastService.success === 'function') {
      window.toastService.success(message);
    }
  }

  function saveVideoForChat(video) {
    if (!video || !video.video_id) return;
    var payload = {
      video_id: video.video_id,
      filename: video.filename || 'Video',
      video_path: video.video_path || null,
      created_at: video.created_at || null
    };
    localStorage.setItem(CHAT_VIDEO_ID_KEY, String(video.video_id));
    localStorage.setItem(CHAT_SELECTION_KEY, JSON.stringify(payload));
    localStorage.setItem(CHAT_PENDING_KEY, JSON.stringify(payload));
  }

  function navigateToChat() {
    var href = 'chat.html';
    if (window.visionaiSpa && typeof window.visionaiSpa.navigate === 'function') {
      window.visionaiSpa.navigate(href).catch(function () {
        window.location.href = href;
      });
    } else {
      window.location.href = href;
    }
  }

  function buildVideoUrl(pathValue) {
    if (!window.visionAPI || typeof window.visionAPI.fetchEventVideoObjectUrl !== 'function') return null;
    return window.visionAPI.fetchEventVideoObjectUrl(pathValue);
  }

  function renderLibrary(videos) {
    var grid = document.getElementById('library-grid');
    var emptyCard = document.getElementById('library-empty-card');
    if (!grid || !emptyCard) return;
    grid.innerHTML = '';

    if (!Array.isArray(videos) || videos.length === 0) {
      emptyCard.classList.remove('d-none');
      return;
    }
    emptyCard.classList.add('d-none');

    videos.forEach(function (video) {
      var col = document.createElement('div');
      col.className = 'col-12 col-md-6 col-xl-4';
      var createdAtText = formatDate(video.created_at);
      col.innerHTML =
        '<div class="card h-100 library-video-card" data-video-id="' + String(video.video_id || '') + '">' +
          '<div class="card-body d-flex flex-column gap-2">' +
            '<video class="library-video-thumb" controls preload="metadata"></video>' +
            '<div class="d-flex align-items-center justify-content-between gap-2">' +
              '<p class="mb-0 fw-semibold fs-9 text-body text-truncate" title="' + String(video.filename || '').replace(/"/g, '&quot;') + '">' + (video.filename || 'Video') + '</p>' +
              '<span class="badge badge-phoenix badge-phoenix-secondary fs-10">Video</span>' +
            '</div>' +
            '<p class="mb-2 text-body-tertiary fs-10 text-truncate">Uploaded: ' + createdAtText + '</p>' +
            '<div class="d-flex gap-2 mt-auto">' +
              '<button type="button" class="btn btn-phoenix-primary btn-sm w-100 library-use-btn">Analyze in Chat</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      var videoEl = col.querySelector('video');
      var useBtn = col.querySelector('.library-use-btn');

      useBtn.addEventListener('click', function () {
        saveVideoForChat(video);
        notifySuccess('Video selected. Opening chat...');
        navigateToChat();
      });

      if (video.video_path) {
        buildVideoUrl(video.video_path)
          .then(function (url) {
            if (url && videoEl) videoEl.src = url;
          })
          .catch(function () {});
      }

      grid.appendChild(col);
    });
  }

  async function loadLibrary() {
    if (!window.visionAPI || typeof window.visionAPI.listStaticVideos !== 'function') {
      notifyError('API client not ready. Please refresh.');
      return;
    }
    var grid = document.getElementById('library-grid');
    if (grid) {
      grid.innerHTML =
        '<div class="col-12"><div class="card"><div class="card-body text-center py-5">' +
        '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>' +
        '</div></div></div>';
    }

    try {
      var res = await window.visionAPI.listStaticVideos();
      var videos = res && Array.isArray(res.videos) ? res.videos : [];
      renderLibrary(videos);
    } catch (err) {
      notifyError((err && err.message) ? err.message : 'Failed to load library.');
      if (grid) grid.innerHTML = '';
    }
  }

  function init() {
    var refreshBtn = document.getElementById('library-refresh-btn');
    if (refreshBtn) refreshBtn.addEventListener('click', loadLibrary);
    loadLibrary();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 0);
  }
})();
    </script>
  </div>
</body>

</html>
