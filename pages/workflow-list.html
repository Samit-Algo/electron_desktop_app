<!DOCTYPE html>
<html lang="en-US" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow List - ComplySure</title>

  <!-- Layout Loader - Must be loaded early -->
  <script src="../custom_js/layout-loader.js"></script>
</head>

<body>
  <!-- Page Content Container - This will be replaced by layout loader -->
  <div id="page-content" style="display:none;">
    <div class="content">

      <div class="modal fade" id="addWorkflowModal" tabindex="-1" aria-labelledby="addWorkflowModalLabel" aria-hidden="true" data-bs-focus="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="addWorkflowModalLabel">Add New Workflow</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="workflowForm" class="row g-3 mb-6 needs-validation" novalidate>

                <div class="col-12">
                  <label for="workflowName" class="form-label">Workflow Name<span class="text-danger">*</span></label>
                  <div class="form-floating mb-3">
                    <input class="form-control" id="workflowName" name="workflow_name" type="text" placeholder="Name" required />
                    <div class="invalid-feedback">
                      Please enter a workflow name.
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label for="workflowCreatedBy" class="form-label">Workflow Created By<span class="text-danger">*</span></label>
                  <div class="form-floating mb-3">
                    <input class="form-control" id="workflowCreatedBy" name="workflow_created_by" type="text" placeholder="Name" required />
                    <div class="invalid-feedback">
                      Please enter a workflow creator name.
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label for="workflowDescription" class="form-label">Workflow description<span class="text-danger">*</span></label>
                  <div class="form-floating mb-3">
                    <input class="form-control" id="workflowDescription" name="workflow_description" type="text" placeholder="Description" required />
                    <div class="invalid-feedback">
                      Please enter a workflow description.
                    </div>
                  </div>
                </div>

                <div class="col-12 text-end mt-4">
                  <button type="button" class="btn btn-phoenix-secondary px-5 me-2" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary px-5">Go to Workflow Designer</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-9">
        <div id="AssetDataTable">
          <div class="row mb-4 gx-6 gy-3 align-items-center">
            <div class="col">
              <h2 class="mb-0">Current Workflow List<span id="totalAssetCount" class="fw-normal text-body-tertiary ms-3"></span></h2>
            </div>
            <div class="col-auto">
              <button id="btnAddWorkflow" class="btn btn-light border px-4 py-2" data-bs-toggle="modal"
                data-bs-target="#addWorkflowModal" style="background-color: white; color: #333; border-color: #ddd;">
                <i class="fa-solid fa-plus me-2"></i>Add New Workflow
              </button>
            </div>
          </div>
          <div class="table-responsive scrollbar">
            <table class="table fs-9 mb-0 border-top border-translucent">
              <thead>
                <tr>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">WORKFLOW NAME</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">VERSION</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">OWNER</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">FLOW KEY</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">INSTANCE COUNT</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">COMPLETED INSTANCE</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">WAITING INSTANCE</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:10%;">ACTIVE STATUS</th>
                  <th class="sort align-middle text-center" scope="col" style="width:10%;">ACTIONS</th>
                </tr>
              </thead>
              <tbody class="list" id="WorkflowTableBody">
                <!-- Dynamic data will be inserted here -->
              </tbody>
            </table>
          </div>
          <div class="pagination-container">
            <!-- Pagination controls will be inserted here -->
          </div>
        </div>
      </div>
    </div>

    <script type="text/visionai-page-script">
(function () {
  'use strict';

  async function loadWorkflow() {
    try {
      const res = await fetch('http://localhost:8000/flow/workflow/get_flows', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' },
      });
      const result = await res.json();

      if (res.ok) {
        console.log(result);
        displayWorkflows(result);
      } else {
        console.error(result);
        alert('Failed to load workflows');
      }
    } catch (err) {
      console.error(err);
      alert('Error loading workflows');
    }
  }

  function displayWorkflows(data) {
    const tbody = document.getElementById("WorkflowTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    // Store workflow data globally for editWorkflow function
    window.currentWorkflowData = data;

    // Update total count
    const totalCount = data.length || 0;
    const totalEl = document.getElementById("totalAssetCount");
    if (totalEl) {
      totalEl.textContent = `(${totalCount} workflows)`;
    }

    data.forEach(workflow => {
      const workflow_status = workflow.workflow_status || 'N/A';
      const flowName = workflow.meta?.name || workflow.flow_key || 'Unnamed Workflow';
      const creator = workflow.flow_owner || 'N/A';
      const instance_count = workflow.instance_count || 'N/A';
      const status_completed = workflow.status_completed || 'N/A';
      const status_waiting = workflow.status_waiting || 'N/A';
      const version = workflow.version || 'N/A';
      const status = workflow_status === 'active' || workflow_status === 'running' || workflow_status === 'enabled' ? 'Active' : 'Inactive';

      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="align-middle ps-0">
          <div class="d-flex align-items-center">
            <div>
              <h6 class="mb-1">
                <strong>${flowName}</strong>
              </h6>
            </div>
          </div>
        </td>
        <td class="align-middle ps-0">
          <span class="text-body-secondary">${version}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="text-body-secondary">${creator}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="badge bg-info fs-9">${workflow.flow_key}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="text-body-secondary">${instance_count}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="text-body-secondary">${status_completed}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="text-body-secondary">${status_waiting}</span>
        </td>
        <td class="align-middle ps-0">
          <span class="badge fs-9 ${status === 'Active' ? 'bg-success' : 'bg-danger'}">${status}</span>
        </td>
        <td class="align-middle text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary btn-sm px-3" data-action="delete" data-flow-key="${workflow.flow_key}">
              <i class="fas fa-trash me-1"></i>Delete
            </button>
            <button class="btn btn-secondary btn-sm px-3" data-action="edit" data-flow-key="${workflow.flow_key}">
              <i class="fas fa-edit me-1"></i>Edit
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(row);
    });

    // Delegate click handlers for action buttons
    tbody.addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const flowKey = btn.getAttribute('data-flow-key');
      const action = btn.getAttribute('data-action');
      if (!flowKey || !action) return;

      if (action === 'delete') {
        deleteWorkflow(flowKey);
      } else if (action === 'edit') {
        editWorkflow(flowKey);
      }
    }, { once: true });
  }

  function navigateTo(href) {
    if (!href) return;
    if (window.visionaiSpa && typeof window.visionaiSpa.navigate === 'function') {
      window.visionaiSpa.navigate(href).catch?.(() => {
        window.location.href = href;
      });
    } else {
      window.location.href = href;
    }
  }

  function editWorkflow(flowKey) {
    const workflowData = window.currentWorkflowData?.find(w => w.flow_key === flowKey);

    let target = 'workflow-editor.html';
    if (workflowData) {
      const params = new URLSearchParams({
        flow_key: flowKey,
        name: workflowData.meta?.name || workflowData.flow_key || '',
        owner: workflowData.flow_owner || '',
        description: workflowData.meta?.description || ''
      });
      target += `?${params.toString()}`;
    } else {
      target += `?flow_key=${encodeURIComponent(flowKey)}`;
    }

    navigateTo(target);
  }

  async function deleteWorkflow(flowKey) {
    if (!confirm('Delete this workflow?')) return;

    try {
      const response = await fetch(`http://localhost:8000/flow/workflow/delete/${flowKey}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
      });
      const result = await response.json();

      if (response.ok) {
        console.log(result);
        loadWorkflow();
        alert('Workflow deleted successfully');
      } else {
        console.error(result);
        alert('Failed to delete workflow');
      }
    } catch (err) {
      console.error(err);
      alert('Error deleting workflow');
    }
  }

  function initWorkflowList() {
    console.log('[WorkflowList] initWorkflowList called. readyState=', document.readyState);
    const workflowForm = document.getElementById('workflowForm');
    const modal = document.getElementById('addWorkflowModal');
    const addBtn = document.getElementById('btnAddWorkflow');
    const workflowNameInput = document.getElementById('workflowName');

    if (workflowNameInput) {
      workflowNameInput.addEventListener('keydown', (e) => {
        console.log('[WorkflowList] workflowName keydown:', e.key, 'valueBefore=', workflowNameInput.value);
      });
    }

    document.addEventListener('keydown', (e) => {
      console.log('[WorkflowList] document keydown:', e.key, 'target=', e.target && e.target.tagName, 'id=', e.target && e.target.id);
    }, { once: false });

    if (addBtn) {
      addBtn.addEventListener('click', () => {
        console.log('[WorkflowList] Add Workflow button clicked');
      });
    }

    // Ensure modal is initialized early and focus works reliably in SPA layout
    if (modal && window.bootstrap && window.bootstrap.Modal) {
      console.log('[WorkflowList] Initializing Bootstrap modal for addWorkflowModal');
      setTimeout(() => {
        const modalInstance = window.bootstrap.Modal.getOrCreateInstance(modal);
        console.log('[WorkflowList] Modal instance ready:', !!modalInstance);
        modal.addEventListener('shown.bs.modal', function () {
          console.log('[WorkflowList] shown.bs.modal fired for addWorkflowModal');
          const input = modal.querySelector('#workflowName');
          console.log('[WorkflowList] Found workflowName input:', !!input);
          if (input) {
            input.focus();
            console.log('[WorkflowList] Focus set to workflowName. activeElement=', document.activeElement && document.activeElement.id);
          } else {
            console.log('[WorkflowList] No input to focus');
          }
        });
      }, 100);
    } else {
      console.log('[WorkflowList] Modal or Bootstrap not available at init time', {
        hasModal: !!modal,
        hasBootstrap: !!window.bootstrap,
        hasBootstrapModal: !!(window.bootstrap && window.bootstrap.Modal)
      });
    }

    if (workflowForm && modal) {
      workflowForm.addEventListener('submit', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const workflowNameInput = document.getElementById('workflowName');
        const workflowCreatedByInput = document.getElementById('workflowCreatedBy');
        const workflowDescriptionInput = document.getElementById('workflowDescription');

        const workflowName = workflowNameInput.value.trim();
        const workflowCreatedBy = workflowCreatedByInput.value.trim();
        const workflowDescription = workflowDescriptionInput.value.trim();

        let isValid = true;

        workflowForm.classList.remove('was-validated');

        if (!workflowName) {
          workflowNameInput.classList.add('is-invalid');
          isValid = false;
        } else {
          workflowNameInput.classList.remove('is-invalid');
          workflowNameInput.classList.add('is-valid');
        }

        if (!workflowCreatedBy) {
          workflowCreatedByInput.classList.add('is-invalid');
          isValid = false;
        } else {
          workflowCreatedByInput.classList.remove('is-invalid');
          workflowCreatedByInput.classList.add('is-valid');
        }

        if (!workflowDescription) {
          workflowDescriptionInput.classList.add('is-invalid');
          isValid = false;
        } else {
          workflowDescriptionInput.classList.remove('is-invalid');
          workflowDescriptionInput.classList.add('is-valid');
        }

        workflowForm.classList.add('was-validated');

        if (isValid) {
          const params = new URLSearchParams({
            name: workflowName,
            owner: workflowCreatedBy,
            description: workflowDescription
          });

          const modalInstance = bootstrap.Modal.getInstance(modal);
          if (modalInstance) {
            modalInstance.hide();
          }

          navigateTo(`workflow-editor.html?${params.toString()}`);
        } else {
          console.log('Form validation failed');
        }
      });

      modal.addEventListener('hidden.bs.modal', function () {
        workflowForm.reset();
        workflowForm.classList.remove('was-validated');

        const inputs = workflowForm.querySelectorAll('.form-control');
        inputs.forEach(input => {
          input.classList.remove('is-valid', 'is-invalid');
        });
      });
    }

    loadWorkflow();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initWorkflowList);
  } else {
    setTimeout(initWorkflowList, 0);
  }
})();
    </script>
  </div>
</body>

</html>
