<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events Board - Vision AI</title>
    
    <!-- Layout Loader - Must be loaded early -->
    <script src="../custom_js/layout-loader.js"></script>
</head>
<body>
    <!-- Page Content Container - This will be replaced by layout loader -->
    <div id="page-content" style="display:none;">
        <div class="content">
            <nav class="mb-3" aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
                    <li class="breadcrumb-item active">Events Board</li>
                </ol>
            </nav>
            
            <div class="row gx-6 gy-3 mb-3 align-items-center">
                <div class="col-auto">
                    <h2 class="mb-0">Events<span class="fw-normal text-body-tertiary ms-3">(<span id="vision-events-count">0</span>)</span></h2>
                </div>
                <div class="col-auto ms-auto">
                    <div class="search-box me-3 d-inline-block">
                        <form class="position-relative">
                            <input class="form-control search-input search" type="search" placeholder="Search events" aria-label="Search" id="vision-events-search" />
                            <span class="fas fa-search search-box-icon"></span>
                        </form>
                    </div>
                </div>
            </div>

            <div class="row g-2 g-md-3 mb-3 align-items-end events-board-filters-bar">
                <div class="col-12 col-md-auto">
                    <label for="vision-events-filter-camera" class="form-label small mb-0 text-body-tertiary">Camera</label>
                    <select class="form-select form-select-sm" id="vision-events-filter-camera" aria-label="Filter by camera">
                        <option value="">All cameras</option>
                    </select>
                </div>
                <div class="col-12 col-md-auto">
                    <label for="vision-events-timeline" class="form-label small mb-0 text-body-tertiary">Timeline</label>
                    <select class="form-select form-select-sm" id="vision-events-timeline" aria-label="Filter by time range">
                        <option value="today">Today</option>
                        <option value="week">This week</option>
                        <option value="month">This month</option>
                        <option value="all" selected>All</option>
                    </select>
                </div>
                <div class="col-12 col-md-auto align-self-end">
                    <button type="button" class="btn btn-phoenix-secondary btn-sm" id="vision-events-filters-clear" aria-label="Clear filters">Clear</button>
                </div>
            </div>

            <div class="row justify-content-between align-items-end mb-4 g-3">
                <div class="col-12">
                    <ul class="nav nav-links mx-n2 flex-wrap" id="vision-events-severity-tabs">
                        <li class="nav-item"><a class="nav-link px-2 py-1 active" data-severity="all" href="#" aria-current="page"><span>All</span><span class="text-body-tertiary fw-semibold ms-1">(<span id="vision-events-cnt-all">0</span>)</span></a></li>
                        <li class="nav-item"><a class="nav-link px-2 py-1" data-severity="Critical" href="#"><span>Critical</span><span class="text-body-tertiary fw-semibold ms-1">(<span id="vision-events-cnt-critical">0</span>)</span></a></li>
                        <li class="nav-item"><a class="nav-link px-2 py-1" data-severity="Warning" href="#"><span>Warning</span><span class="text-body-tertiary fw-semibold ms-1">(<span id="vision-events-cnt-warning">0</span>)</span></a></li>
                        <li class="nav-item"><a class="nav-link px-2 py-1" data-severity="Info" href="#"><span>Info</span><span class="text-body-tertiary fw-semibold ms-1">(<span id="vision-events-cnt-info">0</span>)</span></a></li>
                        <li class="nav-item"><a class="nav-link px-2 py-1" data-severity="Resolved" href="#"><span>Resolved</span><span class="text-body-tertiary fw-semibold ms-1">(<span id="vision-events-cnt-resolved">0</span>)</span></a></li>
                    </ul>
                </div>
            </div>
            
            <div class="row g-3 mb-9" id="vision-events-board-grid">
                <!-- Events loaded by notification-hub.js (listEvents + live refresh) -->
            </div>
        </div>
    </div>

    <style>
        .events-board-filters-bar .form-select-sm { min-width: 8rem; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-clamp: 2;
        }
        .btn-reveal-trigger:hover .btn-reveal {
            opacity: 1;
        }
        .btn-reveal {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
    </style>

</body>
</html>
