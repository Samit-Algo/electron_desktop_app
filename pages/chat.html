<!DOCTYPE html>
<html lang="en-US" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat - Vision AI</title>

  <!-- Layout Loader - Must be loaded early -->
  <script src="../custom_js/layout-loader.js"></script>
</head>

<body>
  <!-- Page Content Container - This will be replaced by layout loader -->
  <div id="page-content" style="display:none;">
    <div class="content chat-page-content">
      <div class="row gy-3 mb-3 flex-shrink-0">
        <div class="col-12">
          <h2 class="mb-2 text-body-emphasis">Algo Vision Analyzer</h2>
          <p class="text-body-tertiary fw-semibold mb-0 fs-9">Upload media in chat — it appears here as a card.</p>
        </div>
      </div>

      <div class="row g-3 chat-page-main-row">
        <!-- Left: User uploaded video / image cards -->
        <div class="col-12 col-lg-4 min-h-0">
          <div class="card h-100 d-flex flex-column min-h-0">
            <div class="card-header bg-body-emphasis py-2 d-flex align-items-center flex-shrink-0">
              <span class="fa-solid fa-images text-primary me-2 fs-9"></span>
              <span class="fw-semibold fs-9">Your uploads</span>
            </div>
            <div class="card-body p-2 overflow-auto flex-grow-1 min-h-0" id="chat-media-cards">
              <!-- Dummy empty state; cards added when user uploads in chat -->
              <p class="text-body-tertiary fs-9 mb-0 text-center py-4" id="chat-media-empty">No uploads yet. Send an image or video in chat to see it here.</p>
            </div>
          </div>
        </div>

        <!-- Right: Normal chat -->
        <div class="col-12 col-lg-8 min-h-0">
          <div class="card h-100 d-flex flex-column min-h-0">
            <div class="card-header bg-body-emphasis py-2 d-flex align-items-center">
              <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary me-2" style="width:24px;height:24px;">
                <span data-feather="cpu" style="width:14px;height:14px;"></span>
              </span>
              <span class="fw-semibold fs-9">Algo Vision Analyzer</span>
            </div>
            <div class="card-body p-0 d-flex flex-column flex-grow-1 overflow-hidden">
              <!-- Messages area -->
              <div class="chat-messages-area flex-grow-1 overflow-auto p-3 scrollbar" id="chat-messages">
                
              </div>
              <!-- Input area -->
              <div class="card-footer border-top px-3 py-3 chat-page-footer" style="background: transparent;">
                <div class="chatbot-input-container">
                  <!-- Video preview (shown when user selects video, before Send) -->
                  <div class="chat-attached-preview d-none align-items-center gap-2 px-2 py-1 mb-1 rounded" id="chat-attached-preview" aria-live="polite">
                    <span class="chat-attached-icon bg-body-secondary rounded d-flex align-items-center justify-content-center" style="width:36px;height:36px;">
                      <span class="fas fa-video text-body-tertiary fs-9"></span>
                    </span>
                    <div class="flex-grow-1 min-w-0">
                      <p class="mb-0 fs-9 text-body text-truncate chat-attached-filename"></p>
                      <span class="text-body-tertiary fs-10">Video</span>
                    </div>
                    <button type="button" class="btn btn-link p-0 text-danger fs-9 chat-attached-remove" id="chat-attached-remove" aria-label="Remove video">
                      <span class="fas fa-times"></span>
                    </button>
                  </div>
                  <textarea class="form-control fs-9" id="chat-input" rows="1" placeholder="Ask anything" style="margin-bottom: 2.75rem;"></textarea>
                  <div class="chatbot-controls-area">
                    <div class="chatbot-btn-group"></div>
                    <div class="chatbot-btn-group ms-auto">
                      <input type="file" id="chat-attach-input" accept="image/*,video/*" class="d-none" aria-hidden="true" />
                      <button type="button" class="chatbot-action-icon" id="chat-attach-btn" title="Upload image or video" aria-label="Upload">
                        <span class="fas fa-paperclip fs-9"></span>
                      </button>
                      <button type="button" class="chatbot-send-btn ms-2" id="chat-send-btn" aria-label="Send" title="Send">
                        <span class="fas fa-arrow-up fs-9"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <style>
        body.chat-page-no-scroll .viewport-scrolls {
          overflow: hidden;
        }
        body.chat-page-no-scroll .viewport-scrolls > .chat-page-content {
          height: 100%;
          min-height: 0;
          padding: 1rem 1.5rem 1.5rem 1.5rem !important;
          box-sizing: border-box;
        }
        .chat-page-content {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
          width: 100%;
          max-width: none;
        }
        .chat-page-main-row { flex: 1; min-height: 0; height: 100%; display: flex; }
        .chat-page-main-row > [class*="col"] {
          min-height: 0;
          height: 100%;
          display: flex;
        }
        .chat-page-main-row .card {
          min-height: 0;
          display: flex;
          flex-direction: column;
          width: 100%;
        }
        .chat-page-main-row .card-body {
          min-height: 0;
          flex: 1 1 auto;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .chat-media-card { transition: opacity 0.2s; }
        .chat-media-card:hover { opacity: 0.9; }
        .chat-messages-area { min-height: 0; }
        /* Message bubbles - same as layout chatbot */
        #chat-messages .user-message-wrapper {
          max-width: 85%;
          width: fit-content;
        }
        #chat-messages .user-message {
          background-color: var(--phoenix-gray-200);
          color: var(--phoenix-black);
          border-radius: 1.5rem;
          padding: 0.5rem 1.15rem;
          width: fit-content;
          max-width: 100%;
          word-wrap: break-word;
          font-size: 0.9rem;
          line-height: 1.5;
        }
        [data-bs-theme="dark"] #chat-messages .user-message {
          background-color: var(--phoenix-gray-800);
          color: var(--phoenix-white);
        }
        #chat-messages .ai-message-transparent {
          background: transparent !important;
          padding: 0.5rem 0;
          max-width: 85%;
          word-wrap: break-word;
          line-height: 1.5;
        }
        /* Footer – same as layout chatbot (simple chat UI) */
        .chat-page-footer .chatbot-input-container {
          background-color: var(--phoenix-emphasis-bg);
          border: 1px solid var(--phoenix-border-color);
          border-radius: 1.25rem;
          padding: 0.75rem 1rem;
          position: relative;
          display: block;
          min-height: 84px;
        }
        .chat-page-footer #chat-input {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0;
          resize: none;
          overflow-y: auto;
          min-height: 24px;
          max-height: 200px;
          width: 100%;
        }
        .chat-page-footer #chat-input:focus { outline: none !important; }
        .chat-page-footer .chatbot-controls-area {
          position: absolute;
          bottom: 0.5rem;
          left: 1rem;
          right: 1rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 32px;
        }
        .chat-page-footer .chatbot-btn-group { display: flex; align-items: center; gap: 0.5rem; }
        .chat-page-footer .chatbot-action-icon {
          width: 28px; height: 28px;
          display: flex; align-items: center; justify-content: center;
          border-radius: 50%; border: none; background: transparent;
          color: var(--phoenix-body-color-tertiary);
          transition: all 0.2s;
        }
        .chat-page-footer .chatbot-action-icon:hover {
          color: var(--phoenix-primary);
          background-color: rgba(var(--phoenix-primary-rgb), 0.1);
        }
        .chat-page-footer .chatbot-send-btn {
          width: 30px; height: 30px;
          border-radius: 50%; border: none;
          display: flex; align-items: center; justify-content: center;
          background-color: var(--phoenix-body-color);
          color: var(--phoenix-body-bg);
          transition: transform 0.1s, background-color 0.2s, color 0.2s;
        }
        .chat-page-footer .chatbot-send-btn:hover { transform: scale(1.05); }
        .chat-page-footer .chatbot-send-btn:active { transform: scale(0.95); }
        [data-bs-theme="dark"] .chat-page-footer .chatbot-send-btn {
          background-color: #fff; color: #000;
        }
        .chat-attached-preview {
          background: rgba(0,0,0,0.04);
          border-radius: 0.5rem;
        }
        [data-bs-theme="dark"] .chat-attached-preview {
          background: rgba(255,255,255,0.06);
        }
        /* Video card progress overlay - blur to unblur */
        .chat-media-card .chat-media-progress-overlay {
          position: absolute;
          inset: 0;
          background: rgba(255,255,255,0.6);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          border-radius: inherit;
          transition: opacity 0.5s ease, backdrop-filter 0.5s ease;
        }
        .chat-media-card.chat-media-done .chat-media-progress-overlay {
          opacity: 0;
          backdrop-filter: blur(0);
          pointer-events: none;
        }
        [data-bs-theme="dark"] .chat-media-card .chat-media-progress-overlay {
          background: rgba(0,0,0,0.6);
        }
        .chat-media-progress-bar {
          width: 80%;
          max-width: 200px;
          height: 6px;
          background: rgba(0,0,0,0.15);
          border-radius: 3px;
          overflow: hidden;
        }
        .chat-media-progress-bar .fill {
          height: 100%;
          width: 30%;
          background: var(--phoenix-primary);
          border-radius: 3px;
          animation: chat-progress-pulse 1.2s ease-in-out infinite;
        }
        @keyframes chat-progress-pulse {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(230%); }
        }
        .chat-media-progress-label {
          font-size: 0.75rem;
          color: var(--phoenix-body-color-secondary);
          font-weight: 500;
        }
        /* Markdown rendering in chat messages */
        #chat-messages .markdown-content {
          word-break: break-word;
        }
        #chat-messages .markdown-content p { margin: 0.5rem 0; line-height: 1.5; }
        #chat-messages .markdown-content p:first-child { margin-top: 0; }
        #chat-messages .markdown-content p:last-child { margin-bottom: 0; }
        #chat-messages .markdown-content strong { font-weight: 600; }
        #chat-messages .markdown-content code {
          background-color: rgba(0,0,0,0.08);
          padding: 0.15em 0.35em;
          border-radius: 4px;
          font-size: 0.92em;
        }
        #chat-messages .markdown-content ul, #chat-messages .markdown-content ol {
          margin: 0.5rem 0;
          padding-left: 1.25rem;
        }
        #chat-messages .markdown-content li { margin: 0.2rem 0; line-height: 1.5; }
        #chat-messages .markdown-content blockquote {
          border-left: 3px solid rgba(0,0,0,0.2);
          padding-left: 0.75rem;
          margin: 0.5rem 0;
          font-style: italic;
        }
      </style>

      <script src="../vendors/marked/marked.min.js"></script>
      <script src="../vendors/dompurify/purify.min.js"></script>
      <script type="text/visionai-page-script">
(function () {
  'use strict';

  function init() {
    document.body.classList.add('chat-page-no-scroll');
    window.__visionaiPageCleanup = function () {
      document.body.classList.remove('chat-page-no-scroll');
    };

    var mediaContainer = document.getElementById('chat-media-cards');
    var mediaEmpty = document.getElementById('chat-media-empty');
    var messagesEl = document.getElementById('chat-messages');
    var attachInput = document.getElementById('chat-attach-input');
    var attachBtn = document.getElementById('chat-attach-btn');
    var chatInput = document.getElementById('chat-input');
    var sendBtn = document.getElementById('chat-send-btn');
    if (!mediaContainer || !messagesEl || !attachInput || !attachBtn || !chatInput || !sendBtn) return;

    function autosizeInput() {
      var cs = window.getComputedStyle(chatInput);
      var lh = parseFloat(cs.lineHeight);
      var lineHeight = Number.isFinite(lh) ? lh : 16;
      var pt = parseFloat(cs.paddingTop) || 0;
      var pb = parseFloat(cs.paddingBottom) || 0;
      var minH = lineHeight + pt + pb;
      if (minH < 24) minH = 24;
      var max = 200;
      chatInput.style.height = '0px';
      var contentH = chatInput.scrollHeight;
      var next = Math.min(Math.max(contentH, minH), max);
      chatInput.style.height = next + 'px';
    }

    var mediaCount = 0;
    var currentVideoId = localStorage.getItem('visionai_chat_video_id') || null;
    var currentVideoMeta = null;
    var pendingVideoFile = null;
    var pendingVideoName = null;
    var pendingLibraryVideo = null;
    var CHAT_SELECTION_KEY = 'visionai_chat_selected_video_meta';
    var CHAT_PENDING_KEY = 'visionai_pending_chat_video';

    var attachPreview = document.getElementById('chat-attached-preview');
    var attachRemoveBtn = document.getElementById('chat-attached-remove');

    function setCurrentVideo(videoId, meta) {
      currentVideoId = videoId || null;
      if (currentVideoId) {
        localStorage.setItem('visionai_chat_video_id', currentVideoId);
      } else {
        localStorage.removeItem('visionai_chat_video_id');
      }
      if (meta && typeof meta === 'object') {
        currentVideoMeta = meta;
        localStorage.setItem(CHAT_SELECTION_KEY, JSON.stringify(meta));
      } else if (meta === null) {
        currentVideoMeta = null;
        localStorage.removeItem(CHAT_SELECTION_KEY);
      }
    }

    function notifyError(message) {
      if (window.toastService && typeof window.toastService.error === 'function') {
        window.toastService.error(message);
      } else {
        alert(message);
      }
    }

    function ensureStaticVideoApi() {
      if (!window.visionAPI) return false;
      return typeof window.visionAPI.staticVideoUpload === 'function' &&
             typeof window.visionAPI.staticVideoAsk === 'function' &&
             typeof window.visionAPI.fetchEventVideoObjectUrl === 'function';
    }

    function parseJsonSafe(v) {
      if (!v) return null;
      try { return JSON.parse(v); } catch (_) { return null; }
    }

    async function renderSelectedLibraryVideoCard(meta) {
      if (!meta || !meta.video_id || !meta.video_path) return;
      if (!mediaContainer) return;

      var existing = mediaContainer.querySelector('[data-video-id="' + String(meta.video_id) + '"]');
      if (existing) return;
      if (mediaEmpty) mediaEmpty.style.display = 'none';

      var url = null;
      try {
        url = await window.visionAPI.fetchEventVideoObjectUrl(meta.video_path);
      } catch (_) {
        url = null;
      }

      mediaCount++;
      var card = document.createElement('div');
      card.className = 'card chat-media-card mb-2 position-relative';
      card.setAttribute('data-media-id', mediaCount);
      card.setAttribute('data-video-id', String(meta.video_id));
      card.innerHTML =
        '<div class="card-body p-2 position-relative">' +
          '<video class="rounded-top" controls preload="metadata" style="width:100%;height:220px;object-fit:contain;background:#000;" ' + (url ? ('src="' + url + '"') : '') + '></video>' +
          '<p class="mb-0 mt-1 fs-10 text-body text-truncate" title="' + String(meta.filename || 'Selected video').replace(/"/g, '&quot;') + '">' + (meta.filename || 'Selected video') + '</p>' +
          '<span class="badge badge-phoenix badge-phoenix-info fs-10">Selected from library</span>' +
        '</div>';
      mediaContainer.prepend(card);
    }

    function consumePendingSelectedVideo() {
      var pending = parseJsonSafe(localStorage.getItem(CHAT_PENDING_KEY));
      if (pending && pending.video_id) {
        localStorage.removeItem(CHAT_PENDING_KEY);
        return pending;
      }
      var selected = parseJsonSafe(localStorage.getItem(CHAT_SELECTION_KEY));
      if (selected && selected.video_id) {
        setCurrentVideo(String(selected.video_id), selected);
        return null;
      }
      return null;
    }


    function addMediaCard(media, withProgress) {
      if (!media) return null;
      mediaCount++;
      if (mediaEmpty) mediaEmpty.style.display = 'none';

      var isVideo = !!media.isVideo;
      var name = media.name || 'Upload ' + mediaCount;
      var card = document.createElement('div');
      card.className = 'card chat-media-card mb-2 position-relative';
      card.setAttribute('data-media-id', mediaCount);

      var thumb = isVideo
        ? '<video class="rounded-top" controls preload="metadata" style="width:100%;height:220px;object-fit:contain;background:#000;" src="' + (media.videoUrl || '#') + '"></video>'
        : '<img src="' + (media.imageUrl || '#') + '" class="rounded-top" style="width:100%;height:180px;object-fit:contain;" alt="" />';

      var overlayHtml = withProgress
        ? '<div class="chat-media-progress-overlay rounded">' +
            '<div class="chat-media-progress-bar"><div class="fill"></div></div>' +
            '<span class="chat-media-progress-label">Uploading & analyzing...</span>' +
          '</div>'
        : '';

      card.innerHTML =
        '<div class="card-body p-2 position-relative">' +
          thumb +
          '<p class="mb-0 mt-1 fs-10 text-body text-truncate" title="' + name.replace(/"/g, '&quot;') + '">' + name + '</p>' +
          '<span class="badge badge-phoenix badge-phoenix-secondary fs-10">' + (isVideo ? 'Video' : 'Image') + '</span>' +
          overlayHtml +
        '</div>';
      mediaContainer.appendChild(card);
      return card;
    }

    function removeProgressOverlay(card) {
      if (!card) return;
      card.classList.add('chat-media-done');
      var overlay = card.querySelector('.chat-media-progress-overlay');
      if (overlay) {
        setTimeout(function () {
          overlay.remove();
          card.classList.remove('chat-media-done');
        }, 550);
      }
    }

    function addChatMessage(text, isUser) {
      var div = document.createElement('div');
      if (isUser) {
        var escaped = text ? String(text).replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
        div.className = 'd-flex justify-content-end mt-3';
        div.innerHTML =
          '<div class="user-message-wrapper d-flex flex-column align-items-end">' +
            '<div class="user-message">' + escaped + '</div>' +
          '</div>';
      } else {
        div.className = 'd-flex flex-column align-items-start mt-3';
        var raw = text ? String(text) : '';
        var html = raw;
        if (window.marked && window.DOMPurify && typeof window.marked.parse === 'function') {
          try {
            var allowedTags = ['p', 'br', 'strong', 'em', 'u', 's', 'code', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'a', 'hr', 'div'];
            var rawHtml = window.marked.parse(raw);
            html = window.DOMPurify.sanitize(rawHtml, { ALLOWED_TAGS: allowedTags, ALLOWED_ATTR: ['href', 'title', 'target', 'rel'], KEEP_CONTENT: true });
          } catch (e) {
            html = raw.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
          }
        } else {
          html = raw.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        }
        div.innerHTML =
          '<div class="ai-message-transparent fs-9 text-body-emphasis markdown-content">' + html + '</div>';
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showAttachPreview(filename) {
      if (!attachPreview) return;
      var fn = attachPreview.querySelector('.chat-attached-filename');
      if (fn) fn.textContent = filename || 'Video';
      attachPreview.classList.remove('d-none');
      attachPreview.classList.add('d-flex');
    }

    function hideAttachPreview() {
      if (!attachPreview) return;
      attachPreview.classList.add('d-none');
      attachPreview.classList.remove('d-flex');
    }

    attachBtn.addEventListener('click', function () {
      attachInput.click();
    });

    if (attachRemoveBtn) {
      attachRemoveBtn.addEventListener('click', function () {
        pendingVideoFile = null;
        pendingVideoName = null;
        pendingLibraryVideo = null;
        localStorage.removeItem(CHAT_PENDING_KEY);
        hideAttachPreview();
      });
    }

    attachInput.addEventListener('change', function () {
      var file = this.files && this.files[0];
      this.value = '';
      if (!file) return;
      pendingLibraryVideo = null;
      localStorage.removeItem(CHAT_PENDING_KEY);
      if (!ensureStaticVideoApi()) {
        notifyError('API client not ready. Please refresh the page.');
        return;
      }
      var isVideo = file.type.startsWith('video/');
      if (!isVideo) {
        var imageUrl = URL.createObjectURL(file);
        addMediaCard({ isVideo: false, name: file.name, imageUrl: imageUrl });
        return;
      }
      pendingVideoFile = file;
      pendingVideoName = file.name;
      showAttachPreview(file.name);
    });

    chatInput.addEventListener('input', function () {
      autosizeInput();
    });
    chatInput.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      if (e.shiftKey) return; /* Shift+Enter: new line (allow default) */
      e.preventDefault();
      var text = chatInput.value.trim();
      if (text.length > 0 || pendingVideoFile) sendBtn.click();
    });
    autosizeInput();

    sendBtn.addEventListener('click', async function () {
      var text = (chatInput.value || '').trim();
      if (!text && !pendingVideoFile && !pendingLibraryVideo) return;

      if (!ensureStaticVideoApi()) {
        notifyError('API client not ready. Please refresh the page.');
        return;
      }

      if (pendingVideoFile) {
        var question = text || null;
        var file = pendingVideoFile;
        var fileName = pendingVideoName || file.name;
        pendingVideoFile = null;
        pendingVideoName = null;
        chatInput.value = '';
        hideAttachPreview();
        autosizeInput();

        var localUrl = URL.createObjectURL(file);
        var card = addMediaCard({ isVideo: true, name: fileName, videoUrl: localUrl }, true);

        if (question) addChatMessage(question, true);

        try {
          var result = await window.visionAPI.staticVideoUpload(file, question);
          var videoId = result && result.video_id ? result.video_id : null;
          if (!videoId) throw new Error('No video_id returned from upload.');
          setCurrentVideo(videoId, null);
          removeProgressOverlay(card);

          if (question && String(question).trim()) {
            var res = await window.visionAPI.staticVideoAsk(videoId, question);
            addChatMessage(res && res.answer ? res.answer : 'No answer returned.', false);
          } else {
            var res = await window.visionAPI.staticVideoAsk(videoId, 'Summarize this video.');
            addChatMessage(res && res.answer ? res.answer : 'No summary available.', false);
          }
        } catch (err) {
          var msg = (err && err.message) ? err.message : 'Video upload failed.';
          notifyError(msg);
          if (card && card.parentNode) card.remove();
          if (mediaContainer && mediaContainer.querySelectorAll('.chat-media-card').length === 0 && mediaEmpty) {
            mediaEmpty.style.display = 'block';
          }
        }
        return;
      }

      if (pendingLibraryVideo) {
        var selected = pendingLibraryVideo;
        var questionForLibrary = text || null;
        pendingLibraryVideo = null;
        localStorage.removeItem(CHAT_PENDING_KEY);
        chatInput.value = '';
        hideAttachPreview();
        autosizeInput();

        var selectedVideoUrl = '#';
        try {
          if (selected.video_path) {
            selectedVideoUrl = await window.visionAPI.fetchEventVideoObjectUrl(selected.video_path);
          }
        } catch (_) {
          selectedVideoUrl = '#';
        }

        var selectedCard = addMediaCard(
          { isVideo: true, name: selected.filename || 'Selected video', videoUrl: selectedVideoUrl },
          true
        );

        setCurrentVideo(String(selected.video_id), selected);
        if (questionForLibrary) addChatMessage(questionForLibrary, true);

        try {
          var libraryAskRes = await window.visionAPI.staticVideoAsk(
            String(selected.video_id),
            questionForLibrary || 'Summarize this video.'
          );
          removeProgressOverlay(selectedCard);
          addChatMessage(
            libraryAskRes && libraryAskRes.answer ? libraryAskRes.answer : 'No answer returned.',
            false
          );
        } catch (err) {
          var askMsg = (err && err.message) ? err.message : 'Video analysis failed.';
          notifyError(askMsg);
          if (selectedCard && selectedCard.parentNode) selectedCard.remove();
          if (mediaContainer && mediaContainer.querySelectorAll('.chat-media-card').length === 0 && mediaEmpty) {
            mediaEmpty.style.display = 'block';
          }
        }
        return;
      }

      chatInput.value = '';
      autosizeInput();

      if (!currentVideoId) {
        notifyError('Upload a video first, then ask questions.');
        return;
      }
      addChatMessage(text, true);
      await askVideo(currentVideoId, text);
    });

    async function askVideo(videoId, question) {
      try {
        var response = await window.visionAPI.staticVideoAsk(videoId, question);
        var answer = response && response.answer ? response.answer : 'No answer returned.';
        addChatMessage(answer, false);
      } catch (err) {
        var msg = (err && err.message) ? err.message : 'Ask failed.';
        addChatMessage(msg, false);
      }
    }

    var selectedMeta = consumePendingSelectedVideo();
    if (selectedMeta && selectedMeta.video_id) {
      pendingLibraryVideo = selectedMeta;
      showAttachPreview(selectedMeta.filename || 'Selected video');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 0);
  }
})();
      </script>
    </div>
  </div>
</body>

</html>
