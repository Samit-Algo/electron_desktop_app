<link rel="stylesheet" href="workflow-list.css">

<div class="content">

      <div class="modal fade" id="addWorkflowModal" tabindex="-1" aria-labelledby="addWorkflowModalLabel" aria-hidden="true" data-bs-focus="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="addWorkflowModalLabel">Add New Watch Dog</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="workflowForm" class="row g-3 mb-6 needs-validation" novalidate>

                <div class="col-12">
                  <label for="workflowName" class="form-label">Watch Dog Name<span class="text-danger">*</span></label>
                  <div class="form-floating mb-3">
                    <input class="form-control" id="workflowName" name="workflow_name" type="text" placeholder="Name" required />
                    <div class="invalid-feedback">
                      Please enter a Watch Dog name.
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label for="workflowDescription" class="form-label">Watch Dog Description<span class="text-danger">*</span></label>
                  <div class="form-floating mb-3">
                    <input class="form-control" id="workflowDescription" name="workflow_description" type="text" placeholder="Description" required />
                    <div class="invalid-feedback">
                      Please enter a Watch Dog description.
                    </div>
                  </div>
                </div>

                <div class="col-12 text-end mt-4">
                  <button type="button" class="btn btn-phoenix-secondary px-5 me-2" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary px-5">Go to Watch Dog Designer</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-9">
        <div id="AssetDataTable">
          <div class="row mb-4 gx-6 gy-3 align-items-center">
            <div class="col">
              <h2 class="mb-0">Current Watch Dogs List<span id="totalAssetCount" class="fw-normal text-body-tertiary ms-3"></span></h2>
              <div class="mt-3 d-flex gap-2" role="tablist" aria-label="Workflow state filter">
                <button id="wf-filter-published" type="button" class="btn btn-sm btn-primary">Published</button>
                <button id="wf-filter-draft" type="button" class="btn btn-sm btn-outline-secondary">Drafts</button>
              </div>
            </div>
            <div class="col-auto">
              <button id="btnAddWorkflow" class="btn btn-light border px-4 py-2" data-bs-toggle="modal"
                data-bs-target="#addWorkflowModal" style="background-color: white; color: #333; border-color: #ddd;">
                <i class="fa-solid fa-dog me-2" aria-hidden="true"></i>Add New Watch Dog
              </button>
            </div>
          </div>
          <div class="table-responsive scrollbar">
            <table class="table fs-9 mb-0 border-top border-translucent">
              <thead>
                <tr>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:22%;">WATCH DOG NAME</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:28%;">DESCRIPTION</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:15%;">EXECUTION STATUS</th>
                  <th class="sort white-space-nowrap align-middle ps-0" scope="col" style="width:12%;">CREATED</th>
                  <th class="sort align-middle text-center" scope="col" style="width:23%;">ACTIONS</th>
                </tr>
              </thead>
              <tbody class="list" id="WorkflowTableBody">
                <!-- Dynamic data will be inserted here -->
              </tbody>
            </table>
          </div>
          <div class="pagination-container">
            <!-- Pagination controls will be inserted here -->
          </div>
        </div>
      </div>
    </div>
